<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크태그</title>
</head>
<body>
    <h1>링크태그</h1>
    <h2>절대경로</h2>
    <p>http://로 시작하는 실제 웹 서비스 주소</p>
    <a href="https://google.com" target="_blank">구글 바로가기</a>
    <a href="https://naver.com" target="_blank">네이버 바로가기</a>
    <a href="https://apple.com" target="_blank">애플 바로가기</a>
    <!-- 네이버 쇼핑탭 클론코딩 -->
    <div id="shopping_wrap">
        <!-- 1. 쇼핑 제목 탭 -->
        <div class="title_controls_wrap">
            <div class="title">
                <a href="#">쇼핑</a>
                <img src="" alt="">
                <a href="#">맨즈</a>
                <img src="" alt="">
                <a href="#">브랜드샵</a>
                <img src="" alt="">
                <a href="#" class="active">MY추천</a>
                <img src="" alt="">
                <a href="#">추천핫딜</a>
                <img src="" alt="">
                <a href="#">쇼핑라이브</a>
            </div> <!--e:1-1 title  -->
            <div class="controls">
                <em class="current_page">1</em>
                <span class="total_page">/12</span>
                <a href="#" class="prev_btn"><img src="" alt="이전 페이지 보기"></a>
                <a href="#" class="next_btn"><img src="" alt="다음 페이지 보기"></a>
            </div> <!-- e:1-2 controls -->
        </div> <!-- e:1 title_controls_wrap -->
        <!-- 2.쇼핑 내용(광고, 주문, 추천태그, 상품목록) -->
        <div class="container">
            <div class="side_bar">
                <div class="ad">
                    <a href="#" target="_blank"><em>쿠팡</em></a>
                    <a href="#" target="_blank"><em>G마켓</em></a>
                    <a href="#" target="_blank">옥션</a>
                    <a href="#" target="_blank">11번가</a>
                    <a href="#" target="_blank"><em>올리브영</em></a>
                    <a href="#" target="_blank">SSG닷컴</a>
                    <a href="#" target="_blank">하프클럽</a>
                    <a href="#" target="_blank">이마트몰</a>
                    <a href="#" target="_blank">GS SHOP</a>
                    <a href="#" target="_blank">패션플러스</a>
                </div><!-- e:2-1-1ad -->
                <div class="user_order_cart">
                    <a href="#" class="order">주문 <img src="" alt="3"></a>
                    <img src="" alt="">
                    <a href="#" class="cart">장바구니 <img src="" alt="1"></a>
                </div><!-- e:2-1-2user_order_cart -->
                <div class="recommend_list">
                    <a href="#" class="active">#가구/인테리어 <img src="" alt=""></a>
                    <a href="#">#화장품/미용</a>
                    <a href="#">#패션잡화</a>
                    <a href="#">#패션의류</a>
                    <a href="#">#출산/육아</a>
                    <a href="#">#생활/건강</a>
                </div><!-- e:2-1-3recommend_list-->
            </div><!-- e:2-1 side_bar -->
            <div class="right_contents">
                <a href="#" target="_blank" class="product">
                    <p class="tumnail"><img src="" alt=""></p>
                    <p class="msg">N포인트 리뷰 이벤트</p>
                    <h2>세론 LPM식탁 타원형 1200X800 화이트 스테인</h2>
                    <div class="review_score_wrap">
                        <p class="score"><img src="" alt="별점">4.76</p>
                        <p class="review">리뷰 29</p>
                    </div>
                </a><!-- *8(8번 반복) -->
            </div><!-- e:2-2 right_contents -->
        </div><!-- e:container -->
        <!-- 3. 내용더보기 -->
        <div class="more_wrap">
            <div class="center">
                <a href=# class="prev_btn"><img src="" alt="이전버튼"></a>
                <div class="center_ment">
                    <em>쇼핑아이템</em> <span>더보기</span>
                    <em class="current_page">1</em>
                    <span class="total_page">/11</span>
                </div>
                <a href=# class="next_btn"><img src="" alt="다음버튼"></a>
            </div>
            <a href=# class="ad_btn">AD</a>
        </div><!--e:3 more_wrap  -->
    </div><!-- e:shopping_wrap -->
</body>
</html>
